<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Man Tuo — Tutti Contributor and Agent Systems Engineer</title>
  <desc id="desc">A high-impact minimal black banner with monumental typography and a single cyan-violet orbital form.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030405" />
      <stop offset="0.58" stop-color="#07090D" />
      <stop offset="1" stop-color="#081018" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A7CFF" />
      <stop offset="0.48" stop-color="#6F9BFF" />
      <stop offset="1" stop-color="#65F2DD" />
    </linearGradient>
    <radialGradient id="atmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#66E7DE" stop-opacity="0.2" />
      <stop offset="0.48" stop-color="#526BFF" stop-opacity="0.07" />
      <stop offset="1" stop-color="#030405" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="pointGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="270" rx="20" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="270" fill="url(#background)" />

    <circle cx="1060" cy="135" r="250" fill="url(#atmosphere)" />
    <circle cx="1082" cy="135" r="184" fill="none" stroke="url(#accent)" stroke-width="1.25" stroke-opacity="0.72" />
    <circle cx="1082" cy="135" r="151" fill="none" stroke="#D8E2FF" stroke-width="0.7" stroke-opacity="0.11" />
    <circle cx="1082" cy="135" r="112" fill="none" stroke="#D8E2FF" stroke-width="0.7" stroke-opacity="0.065" />

    <path d="M902 40C1002 95 1046 230 1188 235" fill="none" stroke="url(#accent)" stroke-width="10" stroke-opacity="0.13" filter="url(#softGlow)" />
    <path d="M902 40C1002 95 1046 230 1188 235" fill="none" stroke="url(#accent)" stroke-width="1.35" stroke-opacity="0.78" />

    <circle cx="965" cy="91" r="4.5" fill="#71A4FF" filter="url(#pointGlow)" />
    <circle cx="1168" cy="226" r="3.5" fill="#65F2DD" filter="url(#pointGlow)" />

    <path d="M690 0V270" stroke="url(#edgeFade)" stroke-width="1" opacity="0.7" />

    <g transform="translate(70,44)">
      <text x="0" y="12" fill="#71EBDD" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="650" letter-spacing="3.2">TUTTI CONTRIBUTOR / AGENT SYSTEMS</text>

      <text x="-4" y="120" fill="#F5F7FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="760" letter-spacing="2">MAN TUO</text>

      <rect x="0" y="149" width="46" height="2" rx="1" fill="url(#accent)" />
      <text x="62" y="155" fill="#8D98AC" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="2.2">BUILDING RELIABLE WORKSPACES FOR PEOPLE + AI AGENTS</text>
    </g>

    <g fill="#657083" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="8.5" letter-spacing="1.7">
      <text x="70" y="242">MT / 2026</text>
      <text x="1130" y="242" text-anchor="end">GITHUB.COM/MT-HUB8</text>
    </g>
  </g>
</svg>
