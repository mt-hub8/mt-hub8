<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Man Tuo — Local-first AI Systems</title>
  <desc id="desc">A minimal dark technology banner showing Man Tuo's name and a connected AI systems diagram.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070B" />
      <stop offset="0.58" stop-color="#0A0E17" />
      <stop offset="1" stop-color="#07131A" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B9DFF" />
      <stop offset="1" stop-color="#6FE7DD" />
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B9DFF" stop-opacity="0.2" />
      <stop offset="1" stop-color="#6FE7DD" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6FE7DD" stop-opacity="0.16" />
      <stop offset="1" stop-color="#6FE7DD" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#D9E1FF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="22" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)" />
    <rect width="1200" height="340" fill="url(#grid)" />
    <circle cx="1010" cy="150" r="245" fill="url(#halo)" />

    <path d="M0 310C284 270 454 321 706 270S1004 178 1200 214V340H0Z" fill="url(#fade)" opacity="0.16" />
    <path d="M0 310C284 270 454 321 706 270S1004 178 1200 214" fill="none" stroke="url(#line)" stroke-opacity="0.18" />

    <g transform="translate(66 56)">
      <text x="0" y="12" fill="#6FE7DD" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="650" letter-spacing="3">MT / SYSTEMS ENGINEER</text>
      <rect x="0" y="35" width="3" height="116" rx="1.5" fill="url(#line)" />
      <text x="25" y="100" fill="#F2F5FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="720" letter-spacing="6">MAN TUO</text>
      <text x="28" y="150" fill="#9AA7C2" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="500" letter-spacing="2.6">LOCAL-FIRST AI · RETRIEVAL · AGENT SYSTEMS</text>

      <g transform="translate(27 195)">
        <circle cx="5" cy="5" r="5" fill="#6FE7DD" filter="url(#glow)" />
        <text x="22" y="10" fill="#65728C" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="2">BUILD / MEASURE / SHIP</text>
      </g>
    </g>

    <g transform="translate(755 43)">
      <rect x="0" y="0" width="377" height="235" rx="14" fill="#0B111B" fill-opacity="0.74" stroke="#9AA7C2" stroke-opacity="0.13" />
      <path d="M0 40H377" stroke="#9AA7C2" stroke-opacity="0.1" />
      <circle cx="20" cy="20" r="3" fill="#6FE7DD" />
      <circle cx="33" cy="20" r="3" fill="#8B9DFF" fill-opacity="0.7" />
      <circle cx="46" cy="20" r="3" fill="#9AA7C2" fill-opacity="0.35" />
      <text x="347" y="24" text-anchor="end" fill="#536079" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="9" letter-spacing="1.5">PIPELINE / LIVE</text>

      <path d="M43 143C91 143 96 84 147 84S201 176 248 176S292 117 337 117" fill="none" stroke="url(#line)" stroke-opacity="0.62" stroke-width="1.5" />
      <path d="M43 143C91 143 96 84 147 84S201 176 248 176S292 117 337 117" fill="none" stroke="#6FE7DD" stroke-opacity="0.12" stroke-width="7" filter="url(#glow)" />

      <g font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="8.5" letter-spacing="1.1" text-anchor="middle">
        <circle cx="43" cy="143" r="7" fill="#0B111B" stroke="#8B9DFF" stroke-width="1.5" />
        <text x="43" y="166" fill="#65728C">DATA</text>

        <circle cx="147" cy="84" r="7" fill="#0B111B" stroke="#829EFF" stroke-width="1.5" />
        <text x="147" y="68" fill="#65728C">RETRIEVE</text>

        <circle cx="248" cy="176" r="7" fill="#0B111B" stroke="#73C9E7" stroke-width="1.5" />
        <text x="248" y="201" fill="#65728C">VERIFY</text>

        <circle cx="337" cy="117" r="7" fill="#0B111B" stroke="#6FE7DD" stroke-width="1.5" filter="url(#glow)" />
        <text x="337" y="101" fill="#65728C">AGENT</text>
      </g>

      <g fill="#536079" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="8" letter-spacing="1">
        <text x="20" y="220">STATUS: OBSERVABLE</text>
        <text x="357" y="220" text-anchor="end">MODE: LOCAL</text>
      </g>
    </g>

    <text x="1134" y="315" text-anchor="end" fill="#47536A" font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.6">GITHUB.COM/MT-HUB8</text>
  </g>
</svg>
